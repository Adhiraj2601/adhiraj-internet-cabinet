    <!-- Critical Preloader CSS inlined in <head> to eliminate any blank gap or flash -->
    <style>
      :root {
        --background: #F4F1EA;
        --foreground: #171717;
        --loader-fill: #1a1a1a;
        --loader-bg: #F4F1EA;
        --loader-dim: rgba(26, 26, 26, 0.10);
        --loader-counter-color: #6b6b6b;
      }
      html {
        background-color: #F4F1EA !important;
      }
      body {
        background-color: #F4F1EA !important;
        margin: 0;
      }
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #F4F1EA;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      @keyframes preloaderFadeInOnce {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .preloader__inner {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-end;
        opacity: 1;
        animation: preloaderFadeInOnce 300ms ease-out 1 forwards;
        transform-origin: center center;
        will-change: transform, opacity;
      }
      .preloader__svg {
        display: block;
        overflow: visible;
        font-family: 'Geologica', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.04em;
        width: clamp(280px, 80vw, 860px);
        height: auto;
      }
      .preloader__text-dim {
        fill: rgba(26, 26, 26, 0.10);
      }
      /* CSS default is 100% EMPTY: wave is translated down past baseline */
      .preloader__liquid-fill {
        fill: var(--loader-fill);
        transform: translate3d(0px, 106px, 0);
        will-change: transform;
      }
      .preloader__wave-2 {
        fill: var(--loader-fill);
        opacity: 0.35;
        transform: translate3d(-30px, 108px, 0);
        will-change: transform;
      }
      .preloader__counter {
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #6b6b6b;
        line-height: 1;
        margin-top: 14px;
        user-select: none;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>

    <!-- Full font stylesheets -->
